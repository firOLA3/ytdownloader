name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - main # Change this if your main branch is named 'master'
    paths:
      - 'frontend/**' # Only trigger when changes are made inside the frontend folder
  workflow_dispatch: # This adds a manual "Run workflow" button in GitHub!

jobs:
  web-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci
        working-directory: ./frontend
        
      - name: 🏗️ Build Frontend
        run: npm run build
        working-directory: ./frontend
        
      - name: 🚀 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          # Because we will use a scoped FTP account, it starts exactly in the right folder
          server-dir: ./
