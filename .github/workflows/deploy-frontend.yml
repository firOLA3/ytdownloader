name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - main # Change this if your main branch is named 'master'
    paths:
      - 'frontend/**' # Only trigger when changes are made inside the frontend folder
  workflow_dispatch: # This adds a manual "Run workflow" button in GitHub!

jobs:
  web-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci
        working-directory: ./frontend
        
      - name: 🔑 Check API URL secret is configured
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL is not set. Add it as a repository secret"
            echo "       pointing at the Render backend (e.g. https://your-app.onrender.com)."
            echo "       Without it the built bundle targets the wrong origin and every"
            echo "       fetch fails in the browser."
            exit 1
          fi
          echo "Building against API: $VITE_API_URL"
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: 🏗️ Build Frontend
        run: npm run build
        working-directory: ./frontend
        env:
          # Baked into the bundle at build time — the frontend (cPanel) and the
          # API (Render) are on different hosts.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        
      - name: 🚀 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          # Because we will use a scoped FTP account, it starts exactly in the right folder
          server-dir: ./
